services:
  - type: web
    name: quickbite-intelligence-backend
    env: python
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/ingest_dataset.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        value: https://quickbite-intelligence.netlify.app,http://localhost:5173
